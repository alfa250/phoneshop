{% extends "base.html" %}

{% block title %}
{{ product.name }}
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row">

        <div class="col-md-5">

            <img src="{{ product.image.url }}"
                 class="img-fluid rounded">

        </div>

        <div class="col-md-7">

            <h2>{{ product.name }}</h2>

            <h3>${{ product.price }}</h3>

            <p>{{ product.description }}</p>

        </div>

    </div>

</div>

{% endblock %}
